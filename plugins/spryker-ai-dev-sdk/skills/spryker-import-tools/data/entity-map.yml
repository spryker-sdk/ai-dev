# Machine-readable entity classification — the single list the keep-lists derive from.
#
# Derived from data/import/local/full_EU.yml @ 528e7c7e85, 2026-08-07.
# No row count is recorded here — the file IS the list (regenerate to re-measure).
# Regenerate the skeleton:  php "$VALIDATE" known-set --emit-map --base .
# Check it stays honest:     php "$VALIDATE" known-set --base .
#
# One row per data_entity in the shipped EU manifest. `source` is the CSV
# basename the manifest points at (it often differs from the entity name — that
# difference is the whole reason this file exists; see stock/warehouse.csv).
#
# class:
#   structural   — theme-INDEPENDENT plumbing: registries, type tables, store
#                  definitions, code-registration, and the marketplace /
#                  measurement / discount wiring a project keeps regardless of its
#                  catalog. `clean` keeps these populated (or reshaped). `why` is
#                  MANDATORY — the reason is the transferable knowledge.
#   content      — theme-DEPENDENT demo data: the specific products, prices,
#                  images, category tree, CMS copy, nav nodes, merchants, offers,
#                  customers, companies, orders, carts, lists — regenerated or
#                  dropped per project.
#   unclassified — undecided. The DEFAULT for anything new, and it BLOCKS the boot
#                  (known-set exits non-zero). A new upstream entity arrives loud
#                  instead of being silently dropped. No shipped entity is
#                  unclassified today.
#
# Three rules that keep this surviving drift:
#   1. unclassified is the default for anything new, and it blocks the boot.
#   2. why is mandatory for structural — the list alone is just data.
#   3. the header carries the commit + date it was measured against, so staleness
#      is a diff, not a re-audit.
#
# NOTE on the two entities the pure structural/content line doesn't settle:
#   - product-search-attribute / -map are classed structural per the review's M3
#     (search-facet plumbing) though their VALUES are theme-dependent — regenerate.
#   - the SSP / service-point family is classed content (feature demo data,
#     droppable); reclassify to structural if your project uses that feature.

