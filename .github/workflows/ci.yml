name: CI

on:
    push:
        branches:
            - 'master'
    pull_request:
    workflow_dispatch:

jobs:
    validation:
        name: Validation
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring, intl, bcmath
                  coverage: none

            - name: Composer Install
              run: composer install --prefer-dist --no-interaction --profile

            - name: Run validation
              run: composer validate

            - name: Syntax check
              run: find ./src -path src -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l -n | (! grep -v "No syntax errors detected" )

            - name: CodeStyle checks
              run: composer cs-check

            - name: CodeStyle fix checks
              run: composer cs-fix

            - name: Architecture sniffer checks
              run: composer architecture-check

            - name: Tests
              run: composer test

    plugins:
        name: Plugins
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: mbstring, intl, bcmath
                  coverage: none

            - name: Plugin manifests, skills and agents
              run: php bin/lint-plugins.php

            - name: Rule sync script
              run: bash tests/scripts/test-sync-rules.sh

            - name: Stop guard, under both harnesses
              run: php plugins/spryker-ai-dev-sdk/hooks/hooks.test.php

            - name: Both hook files declare the same hooks
              run: php bin/lint-hook-parity.php

    lowest:
        name: Prefer Lowest
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: mbstring, intl, bcmath
                  coverage: none

            - name: Composer Install
              run: composer install --prefer-dist --no-interaction --profile

            - name: Composer Update
              run: composer update --prefer-lowest --prefer-dist --no-interaction --profile -vvv
