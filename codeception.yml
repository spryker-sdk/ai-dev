namespace: SprykerSdkTest\Zed\AiDev

paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs

settings:
    colors: true
    memory_limit: 1024M

extensions:
    enabled:
        - Codeception\Extension\RunFailed

suites:
    business:
        path: SprykerSdkTest/Zed/AiDev/Business
        actor: BusinessTester
        modules:
            enabled:
                - Asserts
